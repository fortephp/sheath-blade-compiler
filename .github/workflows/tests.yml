name: Run Tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  package-archive:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    name: Validate release archive

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none

      - name: Validate package metadata
        run: composer validate --strict --no-check-lock --no-check-publish

      - name: Build and inspect archive
        shell: bash
        run: |
          composer archive --format=zip --dir=build
          archive="$(find build -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$archive"
          test "$(stat -c '%s' "$archive")" -lt 1048576
          if unzip -Z1 "$archive" | grep -Eq '(^|/)(vendor|tests|\.github|\.idea)/'; then
            echo 'Release archive contains development-only files.' >&2
            exit 1
          fi
          unexpected_root="$(unzip -Z1 "$archive" | awk -F/ 'NF == 1 && $0 !~ /^(composer\.json|license\.md|readme\.md)$/')"
          if [ -n "$unexpected_root" ]; then
            echo 'Release archive contains unexpected root files:' >&2
            echo "$unexpected_root" >&2
            exit 1
          fi

  php-tests:
    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        os: [ubuntu-latest]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
          # One Windows job catches platform-specific process, path, and encoding regressions.
          - php: 8.4
            laravel: 12.*
            stability: prefer-stable
            os: windows-latest
            testbench: 10.*
        exclude:
          - php: 8.2
            laravel: 13.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Update apt sources
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get check || sudo apt --fix-broken install -y
          sudo apt-get update

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Set framework constraints
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: Install dependencies
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: |
            composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed dependencies
        run: composer show -D

      - name: Execute tests
        # Bash works on both runners and can execute the extensionless Pest proxy.
        shell: bash
        run: ./vendor/bin/pest --ci --parallel

  static-analysis:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    name: Static analysis and style

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Install dependencies
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Validate optimized autoloading
        run: composer dump-autoload --optimize --strict-psr --strict-ambiguous

      - name: Check whitespace errors
        run: git diff --check

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Rector
        run: ./vendor/bin/rector process --dry-run --no-progress-bar
